# ==============================================================================
# CẤU HÌNH BACKEND SPRING BOOT - UNILEND
# ==============================================================================
spring.application.name=unilend-backend
server.port=8080

# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/unilend_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình JWT (JSON Web Token)
unilend.jwt.secret=UniLendUniversityEquipmentManagementSystemSecretKey2026SuperSecureKeyForHS256
unilend.jwt.expiration-ms=86400000
